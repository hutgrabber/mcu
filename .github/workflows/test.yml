# Runs the same Docker test setup as on the Mac: build checks, page tests and the Firebase emulator.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # started by the weekly ratings refresh, whose own pushes don't start workflows
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the test image
        run: docker compose build
      - name: Run every test against the Firebase emulator
        run: docker compose run --rm dev npm run test:all
      - name: Keep screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
