# Refreshes the IMDb and Rotten Tomatoes ratings every week, and publishes them through a pull request that merges
# itself once the full test suite passes, like any other change to main.
#
# It acts with the owner's token (the RATINGS_TOKEN secret), not the workflow's own: GitHub doesn't start workflows
# for pushes or pull requests made with a workflow's own token, so the tests main requires would never run.
name: Refresh ratings
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays at 07:00 UTC
  workflow_dispatch:
  push:                   # and straight after a change to how ratings are fetched, such as a new title's IMDb id
    branches: [main]
    paths: [scripts/ratings.py, src/imdb.json, .github/workflows/ratings.yml]
permissions:
  contents: read
concurrency:
  group: refresh-ratings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: ratings-refresh
      GH_TOKEN: ${{ secrets.RATINGS_TOKEN }}
    steps:
      - name: Check the secrets are set
        env:
          HAS_TOKEN: ${{ secrets.RATINGS_TOKEN != '' }}
          HAS_KEY: ${{ secrets.OMDB_API_KEY != '' }}
        run: |
          [ "$HAS_KEY" = true ] || { echo "The OMDB_API_KEY secret isn't set."; exit 1; }
          [ "$HAS_TOKEN" = true ] || { echo "The RATINGS_TOKEN secret isn't set. See the Ratings section of the README."; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RATINGS_TOKEN }}
      - name: Fetch the ratings from OMDb
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python3 scripts/ratings.py
      - name: Rebuild the page
        run: python3 src/build.py
      - name: Stop if nothing changed
        id: changed
        run: |
          if git diff --quiet; then echo "Ratings are unchanged."; echo "any=no" >> "$GITHUB_OUTPUT"; else echo "any=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Open a pull request that merges itself once the tests pass
        if: steps.changed.outputs.any == 'yes'
        run: |
          day=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/ratings.json index.html
          git commit -m "Refresh the ratings from OMDb ($day)"
          git push --force origin "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" != "OPEN" ]; then
            gh pr create --base main --head "$BRANCH" --title "Refresh the ratings from OMDb ($day)" \
              --body "The automatic ratings refresh from .github/workflows/ratings.yml. It merges itself once the tests pass."
          fi
          gh pr merge "$BRANCH" --auto --merge
