# Local tools run here so nothing needs installing on the Mac.
#   docker compose run --rm dev npm test        page tests
#   docker compose run --rm dev npm run test:all page and rules tests against the Firebase emulator
#   docker compose run --rm dev npx firebase login --no-localhost   sign the Firebase tool into your Google account, once
#   docker compose run --rm dev npm run deploy:rules                 put firebase/firestore.rules live on backend-mcu
services:
  dev:
    build:
      context: .
      dockerfile: tests/Dockerfile
    working_dir: /app
    init: true
    ipc: host
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - firebase-cache:/root/.cache/firebase
      - firebase-login:/root/.config
volumes:
  node_modules:
  firebase-cache:
  firebase-login:
