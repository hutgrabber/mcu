# Local tools run here so nothing needs installing on the Mac.
#   docker compose run --rm dev npm test        page tests
#   docker compose run --rm dev npm run test:all page and rules tests against the Firebase emulator
services:
  dev:
    build:
      context: .
      dockerfile: tests/Dockerfile
    working_dir: /app
    init: true
    ipc: host
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - firebase-cache:/root/.cache/firebase
volumes:
  node_modules:
  firebase-cache:
